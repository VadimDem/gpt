{% extends 'base.html' %}
{% block title %}Каталог{% endblock %}
{% block content %}
<ul>
    {% for product in products %}
    <li>
        <a href="{{ url_for('product_detail', product_id=product.id) }}">{{ product.name }}</a> - {{ product.price }} руб.
    </li>
    {% endfor %}
</ul>
{% endblock %}
